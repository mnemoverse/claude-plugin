name: AI plugin scanner

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@d0e7bf3ebeb0312c347e51f1dc3552fb264b426c # v1.2.766
        with:
          plugin_dir: "."
          min_score: 70
          fail_on_severity: high
          pr_comment: "off"
