name: Manifest drift guard

on:
  push:
  pull_request:
  schedule:
    # Catches drift landing in cursor-plugin or gemini-extension (this repo
    # has no push/PR trigger from those repos) within a day.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-manifest-drift.mjs
