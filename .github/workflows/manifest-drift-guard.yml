name: Manifest drift guard

on:
  push:
  pull_request:
  schedule:
    # Catches drift landing in cursor-plugin or gemini-extension (this repo
    # has no push/PR trigger from those repos) within a day.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-manifest-drift.mjs

  # The Claude plugin directory accepts only plugin files, so it gets a lean
  # build of this plugin (scripts/claude-directory/). This builds that tree,
  # checks it against the directory's file, manifest and text rules, proves
  # with negative fixtures that every rule still rejects what it should, and
  # uploads the tree so a reviewer can see exactly what would be published.
  # The daily schedule exists for drift in other repositories, which this job
  # does not read, so it skips scheduled runs.
  claude-directory:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build and check the Claude directory tree
        run: node scripts/claude-directory/check.mjs --out "$RUNNER_TEMP/claude-directory"
      - name: Test the release rules and the entry points
        run: node .github/scripts/claude-directory/test.mjs
      - name: Upload the built tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-directory-tree
          path: ${{ runner.temp }}/claude-directory
          include-hidden-files: true
          if-no-files-found: error
