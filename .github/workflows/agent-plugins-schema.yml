name: Agent Plugins schema

# plugin.json and mcp.json at the root are the portable Agent Plugins 1.0.0
# manifests nine hosts read. This checks them against the official schemas
# (vendored in schemas/agent-plugins/1.0.0/), and proves on every run that the
# check can fail: a copy with a broken plugin.json must be rejected.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Manifests match Agent Plugins 1.0.0
        run: python scripts/validate-agent-plugins.py
      - name: The check rejects a broken manifest
        run: |
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          python - "$tmp/repo/plugin.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          d.pop("name", None)
          json.dump(d, open(p, "w"))
          PY
          if python "$tmp/repo/scripts/validate-agent-plugins.py"; then
            echo "::error::a plugin.json without name passed the schema check"
            exit 1
          fi
          echo "broken manifest rejected, as it should be"
